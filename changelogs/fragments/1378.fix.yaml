bugfixes:
  - 'Fixed that using the zhmc_partition module with C(expand_storagegroups: true)
    resulted in an unhandled KeyError exception when storage groups with type other
    than "fcp" were attached to the partition. (issue 1378)'
  - 'Fixed the description of the "storage-groups" property in the return value
    of the zhmc_partition module. It was referring to the return value of the
    zhmc_storage_group module with expand=true, which has some additional
    properties that are not in the return value of the zhmc_partition module.'
breaking_changes:
  - 'The return value of the zhmc_partition module with C(expand_storagegroups: true)
    was changed for storage groups with type other than "fcp" because such
    storage groups do not have virtual storage resources or candidate adapter
    ports.
    Previously, such storage groups in the module return value had properties
    "virtual-storage-resources" and "candidate-adapter-ports" that had an
    empty list as their values. Now, these properties are omitted from such
    returned storage groups.'
